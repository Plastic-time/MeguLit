<title>MeguLit 安装</title>
<style>
/* MeguLit installer, one-take 3D scene. Themes: edge (light, Mirror's-Edge-like blocks + crimson guide) | night (dark). */
:root{--red:#c8203c;--red-hot:#ec3a58;--amber:#d6203f;--glass:#7f93b3;--edge:#111317;--ok:#1f9d63;
  --bg1:#eceff3;--bg2:#fbfcfd;--ink:#14161a;--mute:#6d7480;--block:#ffffff;--block-side:#d6dbe3;--block-top:#f4f5f8;--tile:#dfe3e9;--tile-edge:#c4cad4;--panel:#ffffffee;--line:#d3d8e0;
  --font:"Segoe UI","Microsoft YaHei UI","Noto Sans SC",system-ui,sans-serif}
:root[data-theme=night]{--glass:#ffffff;--edge:#ffffff;--bg1:#0d0f13;--bg2:#1b1e26;--ink:#eceef2;--mute:#8d95a3;--block:#1d2028;--block-side:#14161c;--block-top:#272b35;--tile:#1c2029;--tile-edge:#2e3440;--panel:#14161cee;--line:#2e3440;--red:#d12a48}
*{box-sizing:border-box;margin:0}
/* frameless window: 32px transparent margin around the visible frame (the host draws no native frame; DWM/Win10 shadow or #shadow in demos) */
:root{--M:32px}
html,body{background:transparent!important}
#desk{position:absolute;inset:0;background:radial-gradient(1200px 700px at 30% 20%,#3b4a68 0%,#1f2738 55%,#12161f 100%);display:none}
.deskmode #desk{display:block}
#win{position:absolute;left:var(--M);top:var(--M);right:var(--M);bottom:var(--M)}
#shadow{position:absolute;left:var(--M);top:var(--M);right:var(--M);bottom:var(--M);border-radius:22px;box-shadow:0 34px 90px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04);display:none}
.deskmode #shadow{display:block}
.native{--M:0px}.native #app{border-radius:0}.native #shadow,.native #desk{display:none}
#app{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--bg2);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
:root[data-theme=night] #app{box-shadow:0 0 0 1px rgba(255,255,255,.1)}
:root.native #app,:root.native[data-theme=night] #app{box-shadow:none}
#chrome{position:absolute;inset:0;pointer-events:none}
/* window resize hot zones + a visible corner grip, only in the real (native) window */
.rz,.rzg{display:none}.native .rz{display:block;position:absolute;z-index:60;pointer-events:auto}.native .rzg{display:block;position:absolute;right:3px;bottom:3px;width:14px;height:14px;z-index:59;pointer-events:none;opacity:.55}
.rz[data-e=l]{left:0;top:var(--rzc,14px);bottom:var(--rzc,14px);width:var(--rz,8px);cursor:w-resize}.rz[data-e=r]{right:0;top:var(--rzc,14px);bottom:var(--rzc,14px);width:var(--rz,8px);cursor:e-resize}.rz[data-e=t]{left:var(--rzc,14px);right:210px;top:0;height:var(--rz,8px);cursor:n-resize}.rz[data-e=b]{left:var(--rzc,14px);right:var(--rzc,14px);bottom:0;height:var(--rz,8px);cursor:s-resize}
.rz[data-e=tl]{left:0;top:0;width:var(--rzc,14px);height:var(--rzc,14px);cursor:nw-resize}.rz[data-e=tr]{right:0;top:0;width:var(--rz,8px);height:var(--rzc,14px);cursor:ne-resize}.rz[data-e=bl]{left:0;bottom:0;width:var(--rzc,14px);height:var(--rzc,14px);cursor:sw-resize}.rz[data-e=br]{right:0;bottom:0;width:var(--rzg,18px);height:var(--rzg,18px);cursor:se-resize}
.go.busy{transform:scale(.97);opacity:.78;pointer-events:none;transition:transform .08s,opacity .08s}
#drag{position:absolute;left:0;right:196px;top:0;height:46px;pointer-events:auto;cursor:default}
#chrome .tab{position:absolute;right:26px;top:-14px;height:48px;padding:14px 8px 0 14px;display:flex;gap:2px;background:var(--red);pointer-events:auto;clip-path:polygon(0 100%,10px 0,100% 0,100% 100%);box-shadow:0 8px 24px rgba(200,32,60,.35)}
#chrome .tab button{width:40px;height:30px;border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .15s}
#chrome .tab button:hover{background:rgba(255,255,255,.2)}#chrome .tab #btnClose:hover{background:#fff;color:var(--red)}
#chrome .tab button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
#chrome .notch{position:absolute;left:-10px;top:150px;width:10px;height:70px;background:var(--red);pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,12,16,.45);pointer-events:auto}
.card.quit{right:auto;left:50%;top:50%;width:440px;margin:-130px 0 0 -220px;pointer-events:auto}
.card.quit p{font-size:14px;margin-top:16px;line-height:1.6}.card.quit .acts{display:flex;align-items:flex-end;gap:8px;margin-top:20px}.card.quit .acts .go{margin:0;flex:1;width:auto;height:46px;font-size:15px}
/* glass shards (inline svg per shard; edges, bevel and thickness are drawn in the svg) */
.shard{position:absolute;overflow:visible;transform-style:flat}
.shard .edge{filter:none}
.shard .back{fill:rgba(17,19,23,.16)}

html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
#view{position:absolute;inset:0;perspective:820px;perspective-origin:50% 50%;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg1) 100%);overflow:hidden}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.o3{position:absolute;transform-style:preserve-3d}
.box>i{position:absolute;display:block;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.box .f{background:var(--block)}.box .b{background:var(--block-side)}.box .l,.box .r{background:var(--block-side)}.box .t{background:var(--block-top)}
.box.red .f,.box.red .l,.box.red .r,.box.red .t,.box.red .b{background:var(--red)}
.box.red .l,.box.red .r{filter:brightness(.82)}
.plane{position:absolute}
.floor{background:repeating-linear-gradient(90deg,transparent 0 119px,var(--line) 119px 120px),repeating-linear-gradient(0deg,transparent 0 119px,var(--line) 119px 120px);opacity:.75}
.guide{background:var(--red);box-shadow:0 0 28px rgba(200,32,60,.55)}
.plate{position:absolute;transform-style:flat;background:var(--block);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
:root[data-theme=night] .plate{box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.plate .bar{position:absolute;left:0;top:0;width:14px;height:100%;background:var(--red)}
.plate h1{position:absolute;left:56px;top:46px;font-size:132px;line-height:1;letter-spacing:-5px;font-weight:800}
.plate h2{position:absolute;left:60px;bottom:48px;font-size:26px;font-weight:500;color:var(--mute);letter-spacing:.5px}
.plate img{position:absolute;left:56px;top:70px;width:560px}
.ghost{position:absolute;font-weight:800;color:var(--ink);opacity:.07;letter-spacing:-6px;white-space:nowrap}
#fx{position:absolute;inset:0;pointer-events:none}
#streaks{position:absolute;inset:0;opacity:0}
#streaks b{position:absolute;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.55}

:root[data-theme=night] #flash{background:#e9eef7}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.10) 100%)}
:root[data-theme=night] #vig{background:radial-gradient(ellipse at 50% 46%,transparent 45%,rgba(0,0,0,.55) 100%)}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden}
.scrimb.layer{inset:auto 0 0 0}
.top{position:absolute;left:28px;right:256px;top:22px;display:flex;align-items:center;justify-content:space-between}
.top img{height:26px;width:auto;display:block}
.steps{display:flex;gap:8px;align-items:center}
.steps i{display:block;width:34px;height:4px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--red)}
.steps span{font-size:11px;letter-spacing:2px;color:var(--mute);margin-left:10px;text-transform:uppercase}
#hud{pointer-events:none}
#hud.waiting .pct,#hud.waiting .stat{visibility:hidden}
.startup-progress #boot{inset:auto 0 0;min-height:128px;padding:22px 56px 42px}.startup-progress #boot b{font-size:22px}.startup-progress #boot i,.startup-progress #boot #bootT2{display:none}.startup-progress #boot u{bottom:22px}
@media (prefers-reduced-motion:reduce){.startup-progress #boot u::after{animation:none;transform:none}}
.pct{position:absolute;left:30px;bottom:74px;font-size:148px;font-weight:800;letter-spacing:-8px;line-height:.9;font-variant-numeric:tabular-nums}
.pct small{font-size:44px;letter-spacing:0;margin-left:6px;color:var(--red)}
.stat{position:absolute;left:36px;bottom:44px;font-size:14px;color:var(--mute);display:flex;gap:22px;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.what{position:absolute;right:30px;bottom:74px;text-align:right;max-width:46%}
.what h3{font-size:24px;font-weight:700}
.what p{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.5}
.what .src{color:var(--red);font-weight:600}
#mini{position:absolute;left:28px;right:28px;bottom:22px;height:10px;display:flex;gap:2px}
#mini i{flex:1;background:var(--line)}
#mini i.a{background:var(--red);opacity:.45}#mini i.d{background:var(--red)}#mini i.r{background:var(--amber)}
.card{position:absolute;right:56px;top:96px;width:430px;background:var(--panel);padding:28px 30px 26px;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 24px 60px rgba(0,0,0,.14);border-top:5px solid var(--red)}
:root[data-theme=night] .card{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.5)}
.card h2{font-size:30px;font-weight:800;letter-spacing:-.5px}
.card .en{font-size:12px;letter-spacing:2px;color:var(--mute);text-transform:uppercase;margin-top:2px}
.row{display:flex;gap:8px;margin-top:20px}
.field{flex:1;height:42px;border:0;background:rgba(127,135,150,.12);color:var(--ink);padding:0 14px;font:inherit;font-size:14px;outline:0;box-shadow:inset 0 -2px 0 var(--line);min-width:0}
.field:focus{box-shadow:inset 0 -2px 0 var(--red)}
.btn{height:42px;padding:0 18px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.btn:hover{background:rgba(127,135,150,.14)}.btn:focus-visible,.go:focus-visible,.sw:focus-visible{outline:3px solid var(--red-hot);outline-offset:2px}
.go{height:52px;width:100%;margin-top:22px;border:0;background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:background .15s,transform .15s}
.go:hover{background:var(--red-hot)}.go:active{transform:translateY(1px)}
.sw{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px;cursor:pointer;user-select:none;background:none;border:0;color:var(--ink);font-family:inherit;padding:0;text-align:left}
.sw i{width:38px;height:20px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;background:#fff;transition:transform .2s}
.sw[aria-checked=true] i{background:var(--red)}.sw[aria-checked=true] i:after{transform:translateX(18px)}
.free{font-size:12px;color:var(--mute);margin-top:10px}.free.bad{color:var(--red);font-weight:600}
.note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.6}
.card.err{border-top-color:var(--amber);left:56px;right:auto;top:auto;bottom:96px;width:480px}
.card.err h2{color:var(--amber)}.card.err p{font-size:14px;margin-top:14px;line-height:1.6}.card.err .tip{font-size:12.5px;color:var(--mute)}
.card.err .acts{display:flex;gap:8px;margin-top:20px}.card.err .acts .go{margin:0;width:auto;flex:1;height:44px;font-size:15px}
.big{position:absolute;left:56px;bottom:62px;font-size:66px;font-weight:800;letter-spacing:-5px;line-height:1}
.big small{display:block;font-size:14px;letter-spacing:3px;color:var(--mute);font-weight:500;margin-top:14px;text-transform:uppercase}
.launch{position:absolute;right:56px;bottom:74px;width:300px}
.etch{position:absolute;transform-style:flat;pointer-events:none}
.etch svg{width:100%;height:100%;display:block;overflow:visible}
.halo{background:none!important}.halo svg{width:100%;height:100%;overflow:visible}
.band{background:repeating-linear-gradient(0deg,var(--red) 0 46px,transparent 46px 120px);opacity:.9;box-shadow:0 0 24px rgba(214,32,63,.45)}
/* glass control panel: frosted, chamfered, light on its edges; the words sit in it like etching */
.card.glassy{width:460px;top:78px;padding:26px 30px 22px;border:0;border-radius:0;background:linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.1) 55%,rgba(255,255,255,.2));-webkit-backdrop-filter:blur(20px) saturate(1.35);backdrop-filter:blur(20px) saturate(1.35);
  clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,30px 100%,0 calc(100% - 30px));box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 50px rgba(255,255,255,.12)}
:root[data-theme=night] .card.glassy{background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 55%,rgba(255,255,255,.08));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 50px rgba(160,190,255,.07)}
.glassy h2{text-shadow:0 1px 0 rgba(255,255,255,.7),0 -1px 0 rgba(0,0,0,.12)}
:root[data-theme=night] .glassy h2{color:#eef3ff;text-shadow:0 0 18px rgba(170,200,255,.45),0 1px 0 rgba(0,0,0,.5)}
.glassy .lbl{font-size:12px;letter-spacing:1px;color:var(--mute);margin-top:18px}.glassy .lbl.sm{margin-top:14px}
.glassy .field{background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 2px 6px rgba(0,0,0,.08)}
:root[data-theme=night] .glassy .field{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 2px 8px rgba(0,0,0,.35)}
.glassy .field:focus{box-shadow:inset 0 0 0 1.5px var(--red),inset 0 2px 6px rgba(0,0,0,.08)}
.glassy .btn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);background:rgba(255,255,255,.14)}
:root[data-theme=night] .glassy .btn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.glassy .row{margin-top:8px}
.pathfull{display:none;font-size:12.5px;line-height:1.5;color:var(--ink);opacity:.82;margin-top:8px;word-break:break-all;min-height:19px}
.meter{height:5px;margin-top:10px;background:rgba(127,135,150,.25);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ink);opacity:.7;transform-origin:0 50%}
.meter.bad i{background:var(--red);opacity:1}
.glassy .free{margin-top:7px}.glassy .free.bad{color:var(--red)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.sugg button{border:0;font:inherit;font-size:12.5px;padding:7px 12px;color:var(--ink);background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);cursor:pointer}
:root[data-theme=night] .sugg button{box-shadow:inset 0 0 0 1px rgba(255,255,255,.26);background:rgba(255,255,255,.06)}
.sugg button:hover,.sugg button.pick{background:var(--red);color:#fff;box-shadow:none}
.sugg button:focus-visible{outline:3px solid var(--red-hot);outline-offset:2px}
.glassy .sw{margin-top:12px}.glassy .go{margin-top:18px;height:48px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.glassy .note{margin-top:10px}
.tchange,.tchange *{transition:color .55s,background-color .55s,border-color .55s,box-shadow .55s,text-shadow .55s,fill .55s!important}
#chrome .tab #btnTheme{opacity:.95}
.pathfull.long{display:block}
.welcome{position:absolute;left:56px;bottom:92px}.welcome i{display:block;width:64px;height:5px;background:var(--red);margin-bottom:16px}.welcome p span{display:block}.welcome p .wl2{font-size:.82em;font-weight:600;margin-top:2px}.welcome p{font-size:34px;font-weight:700;letter-spacing:-.5px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.6)}
#trialTag{font-size:11px;letter-spacing:.5px;color:var(--mute);padding:3px 9px;box-shadow:inset 0 0 0 1px var(--line);margin-left:16px;white-space:nowrap}

/* buttons: chamfer echoes the top-right tab; edge light sweeps on hover (transform/opacity only) */
.go{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;height:54px;padding:0 26px;font-size:18px;letter-spacing:2px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);transition:transform .18s cubic-bezier(.2,.8,.2,1),background .15s}
.go::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-120%);opacity:0;pointer-events:none}
.go::after{content:"";width:16px;height:12px;flex:none;background:currentColor;clip-path:polygon(0 42%,62% 42%,62% 8%,100% 50%,62% 92%,62% 58%,0 58%);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.go:hover::before{opacity:1;transform:translateX(120%);transition:transform .7s ease,opacity .1s}
.go:hover::after{transform:translateX(5px)}.go:active{transform:scale(.97)}
.go:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--ink)}
#retry::after,#stay::after{display:none}
.btn{position:relative;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);transition:background .15s,transform .18s cubic-bezier(.2,.8,.2,1)}.btn:active{transform:scale(.97)}
html[data-btn=B] .go{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}html[data-btn=B] .go:hover{background:var(--red);color:#fff}
html[data-btn=C] .go{padding:0 0 0 26px;justify-content:space-between;gap:0}html[data-btn=C] .go::after{width:54px;height:54px;background:#0000;box-shadow:none;clip-path:none;border-left:1px solid rgba(255,255,255,.4);background:linear-gradient(currentColor,currentColor) center/16px 2px no-repeat}
/* full-size text layers must not swallow clicks meant for the cards and buttons below them */
.layer{pointer-events:none}.layer .card,.layer .launch,.layer button,.layer input,.layer a,.layer .scrim{pointer-events:auto}
/* first-frame placeholder of the real installer: plain background and one line until the scene has drawn its first seconds */
#boot{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:flex-start;padding-left:56px;padding-bottom:92px;align-items:flex-end;background:#eef2f9;color:#15181f;font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;transition:opacity .6s ease}
.native #boot{display:flex}#boot.gone{opacity:0;pointer-events:none}
#boot i{display:block;width:64px;height:5px;background:#c8203c;margin:0 0 16px}#boot b{display:block;font-size:34px;font-weight:700;letter-spacing:-.5px;text-align:left}#boot b+b{font-size:28px;font-weight:600;margin-top:2px}#boot u{display:block;position:absolute;left:56px;right:56px;bottom:30px;height:3px;background:rgba(21,24,31,.08);overflow:hidden}#boot u::after{content:'';position:absolute;left:0;top:0;height:100%;width:28%;background:#c8203c;animation:bootbar 1.3s ease-in-out infinite}@keyframes bootbar{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
/* the original colour logo sits in the scene: a faint soft shadow, slightly calmer colour, a gentle fade-in; a thin light rim on dark so it stays readable */
#topLogo{height:30px!important;opacity:0;animation:logoin .8s .35s ease forwards;filter:saturate(.9) brightness(1.04) drop-shadow(0 1px 2px rgba(30,40,70,.2))}
:root[data-theme=night] #topLogo{filter:saturate(.95) brightness(1.18) drop-shadow(0 0 1px rgba(255,255,255,.6)) drop-shadow(0 0 5px rgba(255,255,255,.12)) drop-shadow(0 1px 2px rgba(0,0,0,.45))}
@keyframes logoin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#topLogo{animation:none;opacity:1}}
/* ?prerender=1: only the scene, for the offline render of the installer videos */
.prerender .layer,.prerender #chrome,.prerender #drag,.prerender #hud,.prerender #scrimb,.prerender #fx,.prerender #desk,.prerender #shadow,.prerender #boot{display:none!important}
.prerender{--M:0px}.prerender #app{border-radius:0;box-shadow:none}
/* the main view settles in (a gentle zoom-out) as the loading screen fades */
.reveal #view{animation:rvin .5s cubic-bezier(.2,.7,.2,1) both}@keyframes rvin{from{transform:scale(1.03)}to{transform:none}}@media (prefers-reduced-motion:reduce){.reveal #view{animation:none}}
/* in-page folder picker (native window only) */
#picker{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(20,28,44,.34);backdrop-filter:blur(3px)}
#picker.on{display:flex}
#picker .pk{width:min(760px,94%);height:min(470px,92%);background:var(--card,#fff);color:var(--ink,#1c2434);border-radius:14px;box-shadow:0 24px 70px rgba(10,20,40,.36);display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden;font:13px/1.4 var(--sans,system-ui,"Microsoft YaHei UI",sans-serif)}
#picker .pkh{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.08)}
#picker .pkh b{font-size:15px;letter-spacing:.02em}#picker .pkh .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;color:#5a667c;font-size:12px}
#picker .pkx{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:inherit;opacity:.6;padding:2px 6px}#picker .pkx:hover{opacity:1}
#picker .pkl{overflow:auto;padding:10px 8px;border-right:1px solid rgba(0,0,0,.08);background:rgba(120,140,170,.07)}
#picker .pkl h4{margin:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#7a869c;text-transform:uppercase}
#picker .pkl button,#picker .pkm button.row{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#picker .pkl button:hover,#picker .pkm button.row:hover{background:rgba(200,32,60,.08)}#picker .pkl button small{display:block;color:#7a869c;font-size:11px}
#picker .pkm{overflow:auto;padding:8px 10px}#picker .pkm .empty{padding:22px;color:#8791a5;text-align:center}
#picker .pkm button.row::before{content:"";display:inline-block;width:14px;height:11px;margin-right:9px;vertical-align:-1px;border-radius:2px;background:#e2b94d;box-shadow:inset 0 3px 0 #efce7a}
#picker .pkm button.up::before{background:#9aa6bd;box-shadow:none}
#picker .pkf{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid rgba(0,0,0,.08)}
#picker .pkf .sp{flex:1}#picker .pkf input{flex:0 1 190px;border:1px solid rgba(0,0,0,.18);border-radius:8px;padding:6px 9px;font:inherit;background:transparent;color:inherit}
#picker .pkf button{border:1px solid rgba(0,0,0,.16);background:transparent;color:inherit;border-radius:9px;padding:7px 14px;cursor:pointer;font:inherit}#picker .pkf button:hover{background:rgba(0,0,0,.05)}
#picker .pkf button.ok{background:var(--red,#c8203c);border-color:var(--red,#c8203c);color:#fff}#picker .pkf button.ok:hover{filter:brightness(1.08)}
#picker .pkmsg{font-size:11px;color:#c8203c;margin-left:4px}

<body>
<div id="boot" role="status"><div><i></i><b id="bootT1"></b><b id="bootT2"></b></div><u></u></div><script>try{var params=new URLSearchParams(location.search), en=params.get('lang')==='en';if(params.get('boot')==='progress'){document.documentElement.classList.add('startup-progress');document.getElementById('bootT1').textContent=en?'Preparing the installer…':'正在准备安装界面…';}else{document.getElementById('bootT1').textContent=en?'Welcome to MeguLit':'欢迎使用MeguLit';document.getElementById('bootT2').textContent=en?'Let us get it installed':'现在开始安装'}}catch(e){}</script>
<div id="desk"></div>
<div id="shadow"></div>
<div id="win"><div id="app">
<div id="view"><img id="vposter" alt="" decoding="sync" style="position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:4" onload="try{var b=document.getElementById('boot');if(b)b.classList.add('gone');window.__posterAt=Math.round(performance.now());if(window.chrome&&chrome.webview)chrome.webview.postMessage({type:'mark',what:'poster',at:window.__posterAt})}catch(e){}"><script>try{var q=new URLSearchParams(location.search),poster=document.getElementById("vposter");if(q.get("boot")==="progress"||q.get("prerender")==="1")poster.remove();else{var vb=(q.get("vbase")||"video/").replace(/\/?$/,"/"),dk=q.get("theme")?q.get("theme")==="night":localStorage.getItem("megulit.setup.theme")==="dark";poster.src=vb+(dk?"dark":"light")+"/intro.jpg"}}catch(e){}</script><video id="v0" muted playsinline preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0"></video><script>/* the opening clip starts decoding in the first moments; player.js takes this element over */try{var q0=new URLSearchParams(location.search);if(q0.get("prerender")!=="1"&&q0.get("reduce")!=="1"&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){var v0=document.getElementById("v0"),vb0=(q0.get("vbase")||"video/").replace(/\/?$/,"/"),dk0=q0.get("theme")?q0.get("theme")==="night":localStorage.getItem("megulit.setup.theme")==="dark";v0.dataset.theme=dk0?"dark":"light";v0.src=vb0+v0.dataset.theme+"/intro.mp4";v0.load()}else document.getElementById("v0").remove()}catch(e){}</script><div id="world"></div></div>
<div id="fx"><div id="vig"></div><div id="streaks"></div><div id="flash"></div></div>
<div class="layer" id="ui-top" style="opacity:1;visibility:visible"><div class="top"><img id="topLogo" src="logos/logo-orig.svg" alt="MeguLit"><div class="steps" id="steps"><i></i><i></i><i></i><i></i><span id="stepname"></span></div></div></div>
<div class="scrimb layer" id="scrimb" style="opacity:1;visibility:visible;pointer-events:none"></div>
<div class="layer" id="hud"><div class="pct"><span id="pct">0</span><small>%</small></div><div class="stat"><span><b id="got">0 MB</b> / <span id="total">0 MB</span></span><span id="speed">测速中</span><span id="eta"></span></div><div class="what"><h3 id="whatT"></h3><p id="whatP"></p></div></div>
<div class="layer" id="ui-welcome" style="opacity:1;visibility:visible"><div class="welcome"><i></i><p id="welcomeSub"></p></div></div>
<div class="layer" id="ui-loc"><div class="card glassy"><h2></h2><div class="en"></div>
  <div class="lbl" id="lblPath"></div>
  <div class="row"><input class="field" id="path" value="D:\MeguLit" spellcheck="false" aria-label="install location"><button class="btn" id="browse"></button></div>
  <div class="pathfull" id="pathfull" aria-live="polite"></div>
  <div class="meter"><i id="meterUsed"></i></div><div class="free" id="free" role="status"></div>
  <div class="lbl sm" id="lblSugg"></div><div class="sugg" id="sugg"></div>
  <button class="sw" id="swDesk" role="switch" aria-checked="true"><i></i><span></span></button>
  <button class="sw" id="swMenu" role="switch" aria-checked="true"><i></i><span></span></button>
  <button class="go" id="install"></button>
  <div class="note"></div></div></div>
<div class="layer" id="ui-err"><div class="card err"><h2 id="errT">下载中断了</h2><div class="en" id="errEn">Download interrupted</div><p id="errM"></p><p class="tip" id="errTip"></p>
  <div class="acts"><button class="go" id="retry">重试 Retry</button><button class="btn" id="copylog">复制日志 Copy log</button><button class="btn" id="manual">手动下载</button></div></div></div>
<div class="layer" id="ui-done"><div class="big"><span id="doneT"></span><small id="doneEn">All set</small></div><div class="launch"><button class="go" id="launch">开读</button></div></div>
<div class="layer" id="ui-mini" style="opacity:1;visibility:visible"><div id="mini"></div></div>
</div>
<div id="picker" role="dialog" aria-modal="true" aria-label="choose install location"><div class="pk"><div class="pkh"><b id="pkT"></b><span class="crumb" id="pkCrumb"></span><button class="pkx" id="pkClose" aria-label="close">×</button></div><div class="pkl" id="pkSide"></div><div class="pkm" id="pkMain"></div><div class="pkf"><input id="pkNew" maxlength="80" spellcheck="false"><button id="pkMk"></button><span class="pkmsg" id="pkMsg"></span><span class="sp"></span><button id="pkMore"></button><button id="pkCancel"></button><button class="ok" id="pkOk"></button></div></div></div>
<div id="chrome"><div id="drag"></div><i class="rz" data-e="l"></i><i class="rz" data-e="r"></i><i class="rz" data-e="t"></i><i class="rz" data-e="b"></i><i class="rz" data-e="tl"></i><i class="rz" data-e="tr"></i><i class="rz" data-e="bl"></i><i class="rz" data-e="br"></i><svg class="rzg" viewBox="0 0 14 14" aria-hidden="true"><path d="M13 3 3 13M13 7 7 13M13 11 11 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg><div class="tab"><button id="btnTheme" aria-pressed="false"></button><button id="btnMin" aria-label="最小化 Minimize"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.6"/></svg></button><button id="btnClose" aria-label="关闭 Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.6"/></svg></button></div><div class="notch"></div></div>
<div class="layer" id="ui-quit"><div class="scrim"></div><div class="card quit"><h2>货还在路上</h2><div class="en">Download in progress</div><p>现在关掉也没关系：已经下好的碎片会保留，下次打开接着下。</p><div class="acts"><button class="go" id="stay">等它到</button><button class="btn" id="leave">回头再来</button></div></div></div>
</div>
<script>/* Scripts load after the first paint, in their order (async=false), so the window shows the poster at once instead of waiting
   for the scene code (cold renderer: ~2 s). three.js + the live 3D scene only for the offline renderer (?prerender=1, tools/setup-scene/). */
(function(){var q=new URLSearchParams(location.search),pre=q.get("prerender")==="1",h=q.get("host"),de=document.documentElement;
if(pre)de.classList.add("prerender");if(h==="1"||h==="2"){if(h==="1")window.__waitConfirm=true;window.__noPrefetch=true;de.classList.add((q.get("native")==="1"||h==="2")?"native":"deskmode")}
var list=["logos/logos.js"];if(pre)list.push("../../tools/setup-scene/three.js");if(!pre)list.push("player.js");list.push("vendor/gsap.min.js","scene.js");if(pre)list.push("../../tools/setup-scene/glass.js");
var f=(h==="1"||h==="2")?"host.js":q.get("demo")==="1"?"demo.js":null;if(f)list.push(f);
function go(){list.forEach(function(src){var s=document.createElement("script");s.src=src;s.async=false;document.body.appendChild(s)})}
if(pre){list.forEach(function(src){document.write("<script src=\""+src+"\"><\/script>")})}else requestAnimationFrame(function(){setTimeout(go,0)})})()</script>
