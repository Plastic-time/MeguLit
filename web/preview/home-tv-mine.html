<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>MeguLit 首页 · 本机数据</title><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="../grimoire.css"><link rel="stylesheet" href="../home-tv.css">
<style>body{margin:0;background:var(--bg);overflow:hidden}.mock-bar{height:var(--titlebar-height,44px);display:flex;align-items:center;gap:22px;padding:0 20px;font-size:13px;color:var(--g-t2);border-bottom:1px solid var(--line);position:relative;z-index:2}.mock-bar b{color:var(--g-gold);font-weight:400;letter-spacing:.2em}#main{position:relative;z-index:1}.mock-log{position:fixed;left:12px;bottom:8px;z-index:20;font:11px Consolas,monospace;color:var(--g-t3)}</style></head>
<body><div class="grimoire-glow" aria-hidden="true"></div><div class="mock-bar"><b>MEGULIT</b><span>首页</span><span>游戏库</span><span>学习</span><span>统计</span><span>设置</span><span style="margin-left:auto">本机数据模拟 · 顶部栏为占位</span></div><main id="main"></main><div class="mock-log" id="log"></div>
<script src="megu-data.local.js"></script>
<script type="module">
import {renderHomeTV} from '../home-tv.js';
import {paintGlow} from '../grimoire.js';
const {home,detail,activity,daily}=window.MEGU_DATA,locale=home.preferences.language||'zh';
try{const saved=JSON.parse(localStorage.getItem('mock-home-showcase'));if(saved)home.preferences.homeShowcase=saved;}catch{}
const log=t=>{document.querySelector('#log').textContent=t;};
const api=async(name,args)=>name==='game_detail'?detail[args.id]||{}:name==='learning_activity'?activity:name==='daily_view'?(daily||{}):{};
const h=new Date().getHours(),greet=(h>=5&&h<12?'早上好':h<18?'下午好':'晚上好')+(home.preferences.username?'，'+home.preferences.username:'');
const rt=t=>{if(!t)return "—";const d=(Date.now()-t*1000)/864e5;return d<1?Math.max(1,Math.round(d*24))+' 小时前':Math.round(d)+' 天前';};
const dur=s=>{const m=Math.round((s||0)/60);return m>=60?Math.floor(m/60)+' 小时 '+(m%60)+' 分':m+' 分';};
renderHomeTV(document.querySelector('#main'),{model:home,api,locale,esc:s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]),icon:n=>n==='play'?'▶':'',number:n=>Number(n||0).toLocaleString(),duration:dur,relativeTime:rt,greeting:greet,navigate:(...a)=>log('跳转 → '+a.join(' / ')),onLaunch:id=>log('继续游玩 → '+home.games.find(g=>g.id===id)?.title),onDetail:id=>log('作品详情 → '+home.games.find(g=>g.id===id)?.title),onAdd:()=>log('添加游戏'),onGame:g=>paintGlow(g.cover||''),savePreferences:v=>{try{localStorage.setItem('mock-home-showcase',JSON.stringify(v.homeShowcase));}catch{}log('已保存展示设置（只存在这个浏览器里）');}});
</script></body></html>
