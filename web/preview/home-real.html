  (()=>{const D=window.MEGU_DATA,log=(...a)=>console.log('[mock]',...a);
   const table={home:()=>D.home,preferences:()=>D.home.preferences,background:()=>D.background||'',game_detail:a=>D.detail[a.id]||{},game_enrich:a=>new Promise(r=>setTimeout(()=>r({game:D.home.games.find(g=>g.id===a.id)}),600)),learning_activity:()=>D.activity,daily_view:()=>D.daily||{},statistics:()=>({buckets:[]}),ui_state:()=>({}),settings_get:()=>window.MEGU_SETTINGS||{},leaderboard_view:a=>new Promise(r=>setTimeout(()=>r({...((window.MEGU_LB||{})[(a.period||'week')+'|'+(a.metric||'seconds')]||(window.MEGU_LB||{})['week|seconds']||{}),configured:true,joined:true,enabled:true}),400)),dialogue:()=>new Promise(r=>setTimeout(()=>r([]),400)),history:()=>new Promise(r=>setTimeout(()=>r(window.MEGU_HISTORY||[]),400)),reader_status:()=>({ready:true}),save_preferences:a=>{Object.assign(D.home.preferences,a.values||{});return D.home.preferences;}};
   window.__TOME_TEST_TRANSPORT__=async(command,args)=>{if(command!=='service'){return null;}const r=args.request||{},f=table[r.action];if(!f){log('unmocked',r.action);return r.action&&/s$/.test(r.action)?[]:{};}return f(r);};
