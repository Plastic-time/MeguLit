<!doctype html>
<!--
  MeguLit 赞赏卡片模板
  二维码直接引用原图（docs/assets/sponsor/alipay.png / wechat.png），不做任何重绘
  渲染：powershell -File tools/sponsor-card/render.ps1
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MeguLit Support Card</title>
<style>
  :root{
    --bg:#171314; --panel:#1f1a1b; --card:#2a2223; --line:#3a2e2f;
    --cream:#f3e9dc; --muted:#a8998f; --red:#c8323c; --gold:#d9a54a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{width:1200px;font-family:"Segoe UI","Microsoft YaHei UI","Yu Gothic UI",sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
  .frame{position:relative;margin:0;padding:44px 56px 40px;background:var(--panel);border-radius:28px;overflow:hidden;border:1px solid var(--line)}
  /* 极细魔法阵线稿 */
  .circle{position:absolute;right:-170px;top:-170px;width:560px;height:560px;opacity:.16;pointer-events:none}
  .circle.b{left:-220px;bottom:-260px;top:auto;right:auto;width:520px;height:520px;opacity:.09}
  header{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:16px;font-size:14px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .crumb img{height:44px}
  .crumb span b{color:var(--red);font-weight:600}
  .book{width:26px;height:26px;color:var(--muted)}
  h1{margin-top:34px;font-size:52px;font-weight:700;letter-spacing:.01em}
  h1 em{font-style:normal;color:var(--red)}
  .sub{margin-top:12px;font-size:20px;color:var(--muted)}
  .sub i{font-style:normal;color:var(--cream)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
  .card{background:var(--card);border-radius:22px;padding:30px 24px 26px;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);position:relative}
  .card::before{content:"";position:absolute;top:0;left:50%;width:56px;height:3px;margin-left:-28px;background:var(--red);border-radius:0 0 3px 3px}
  .qr{width:300px;height:300px;background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center}
  .qr img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
  .qr.missing{background:#332a2b;border:1px dashed #5a4a4b}
  .qr.missing img{display:none}
  .qr.missing::after{content:"QR";font-size:42px;letter-spacing:.2em;color:#6d5c5d;font-weight:700}
  .name{margin-top:20px;font-size:24px;font-weight:700}
  .en{margin-top:4px;font-size:17px;color:var(--muted);letter-spacing:.06em}
  footer{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;color:var(--muted)}
  footer svg{width:18px;height:18px;color:var(--red)}
</style>
</head>
<body>
<div class="frame" id="card">
  <svg class="circle" viewBox="0 0 200 200" fill="none" stroke="#c8323c" stroke-width=".5">
    <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="88"/><circle cx="100" cy="100" r="58"/>
    <polygon points="100,12 176,144 24,144"/><polygon points="100,188 24,56 176,56"/>
    <circle cx="100" cy="100" r="22"/>
  </svg>
  <svg class="circle b" viewBox="0 0 200 200" fill="none" stroke="#d9a54a" stroke-width=".5">
    <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="70"/>
    <polygon points="100,30 166,100 100,170 34,100"/><circle cx="100" cy="100" r="30"/>
  </svg>

  <header>
    <div class="crumb"><img src="../../docs/assets/logo.png" alt=""><span>MeguLit <b>/</b> Support</span></div>
    <svg class="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>
    </svg>
  </header>

  <h1>支持 <em>MeguLit</em></h1>
  <p class="sub">如果 MeguLit 帮你多读懂了几句台词，欢迎赞助一点<i>厄里斯</i>，支持它继续开发 ヾ(≧▽≦*)o</p>

  <div class="grid">
    <div class="card">
      <div class="qr"><img src="../../docs/assets/sponsor/alipay.png" alt="" onerror="this.parentNode.classList.add('missing')"></div>
      <div class="name">支付宝</div><div class="en">Alipay</div>
    </div>
    <div class="card">
      <div class="qr"><img src="../../docs/assets/sponsor/wechat.png" alt="" onerror="this.parentNode.classList.add('missing')"></div>
      <div class="name">微信赞赏</div><div class="en">WeChat</div>
    </div>
  </div>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>
    Made with a little magic
  </footer>
</div>
</body>
</html>
